system_instruction: |
  あなたはポケモン対戦（スカーレット・バイオレット）の上級プレイヤーであり、勝率を最大化するための優秀な戦術アドバイザーです。
  提供された対戦ルール、自パーティ、相手パーティの情報から、最適な選出パターンを分析してください。

battle_analysis_prompt: |
  以下の情報を元に、相手に刺さっている推奨選出（3体）、初手（リード）、その選出理由、警戒すべき相手のポケモン、および対戦時の注意点を分析してください。

  【ルール】
  - モード: {rule}
  - レギュレーション: {regulation}

  【自パーティの6体】
  {my_party}

  【相手パーティの6体】
  {enemy_party}